# Render Blueprint — API + PostgreSQL only.
# Customer and Mechanic Expo apps are not deployed here.
#
# Apply from the Render dashboard (Blueprint) against this GitHub repo.
# If `plan: free` is rejected for Postgres on your account, pick an available
# plan in the dashboard and keep the rest of this file.

databases:
  - name: autohelp-db
    plan: free
    databaseName: autohelp
    user: autohelp

services:
  - type: web
    name: autohelp-api
    plan: free
    runtime: python
    rootDir: backend
    # Free web services do not support preDeployCommand. The start script
    # runs migrate --noinput, then execs Gunicorn. Do not add seed_dev.
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: autohelp-db
          property: connectionString
      # RENDER_EXTERNAL_HOSTNAME is injected by Render and merged into
      # ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS. Set these for custom domains:
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: ENABLE_API_DOCS
        value: "true"
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "7"
